<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Input Barang - Multi Item 1 Resi</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" type="text/javascript"></script>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f3f3f3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background-color: #fff;
      padding: 25px 30px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 400px;
    }
    input, button, select {
      width: 100%;
      padding: 9px;
      margin-top: 6px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      background-color: #1976d2;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #0d47a1;
    }
    .btn-scan {
      background-color: #2e7d32;
      margin-top: 0;
    }
    .btn-scan:hover {
      background-color: #1b5e20;
    }
    .btn-add {
      background-color: #e65100;
    }
    .btn-add:hover {
      background-color: #bf360c;
    }
    #reader {
      width: 100%;
      background: #000;
      border-radius: 8px;
      margin-bottom: 15px;
      overflow: hidden;
    }
    .user-text {
      font-size: 14px;
      color: #555;
      margin-top: -5px;
      margin-bottom: 12px;
      font-style: italic;
    }
    table.preview-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      margin-bottom: 15px;
      font-size: 13px;
    }
    table.preview-table th, table.preview-table td {
      border: 1px solid #ddd;
      padding: 6px;
      text-align: center;
    }
    table.preview-table th {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>

<div class="container">
  <div id="loginForm">
    <h2>Login</h2>
    <input type="text" id="userId" placeholder="User ID" required>
    <input type="password" id="password" placeholder="Password" required>
    <button onclick="login()">Login</button>
  </div>

  <div id="mainForm" style="display:none;">
    <h2>Form Input Packer</h2>
    <div id="userDisplay" class="user-text"></div>
    
    <div id="reader" style="display: none;"></div>

    <div>
      <label><b>Nomor Resi:</b></label>
      <input type="text" id="inputResi" placeholder="Scan atau ketik Resi">
      <button type="button" class="btn-scan" id="btnScanResi" onclick="toggleKamera('inputResi', 'btnScanResi')">📷 Scan Resi</button>

      <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">

      <label>Item:</label>
      <input type="text" id="inputItem" placeholder="Scan atau ketik Item">
      <button type="button" class="btn-scan" id="btnScanItem" onclick="toggleKamera('inputItem', 'btnScanItem')">📷 Scan Item</button>

      <label>Qty:</label>
      <input type="number" id="inputQty" value="1" min="1">

      <button type="button" class="btn-add" onclick="tambahKeList()">➕ Tambah </button>
    </div>

    <!-- Tabel Preview sebelum dikirim -->
     <h4>Daftar Item :</h4>
    <table class="preview-table">
      <thead>
        <tr>
          <th>Resi</th>
          <th>Item</th>
          <th>Qty</th>
          <th>Act</th>
        </tr>
      </thead>
      <tbody id="listPreview">
        <tr><td colspan="4" style="color: #888;">Belum ada item ditambahkan</td></tr>
      </tbody>
    </table>

    <button type="button" style="background-color: #2e7d32;" onclick="Kirim()">🚀 Kirim</button>
  </div>
</div>

<script>
  const LIST_USER = {
    "DIMAS": "12345",
    "SATRIA": "12345",
    "IWAN": "12345",
    "CECEP": "12345",
    "DEWA":"12345",
    "SANDI":"12345",
    "ZAENAL": "12345"
  };

  let currentUser = ""; 
  let activeTargetInput = null;
  let keranjangItem = []; // Menyimpan daftar item sementara

  function login() {
    const user = document.getElementById("userId").value.trim();
    const pass = document.getElementById("password").value;

    if (LIST_USER[user] && LIST_USER[user] === pass) {
      currentUser = user; 
      document.getElementById("userDisplay").innerText = "User: " + currentUser;
      document.getElementById("loginForm").style.display = "none";
      document.getElementById("mainForm").style.display = "block";
    } else {
      alert("User ID atau Password salah");
    }
  }

  let html5Qrcode = null;

  function toggleKamera(targetInputId, btnId) {
    const readerElement = document.getElementById("reader");
    const btnScan = document.getElementById(btnId);

    activeTargetInput = document.getElementById(targetInputId);

    if (readerElement.style.display === "none") {
      readerElement.style.display = "block";
      btnScan.innerText = "❌ Matikan Kamera";
      btnScan.style.backgroundColor = "#d32f2f";

      if (!html5Qrcode) {
        html5Qrcode = new Html5Qrcode("reader");
      }

      html5Qrcode.start(
        { facingMode: "environment" },
        { fps: 15, qrbox: { width: 250, height: 150 } },
        (decodedText) => {
          if (activeTargetInput) {
            activeTargetInput.value = decodedText;
          }
          matikanKameraSaja();
        },
        (errorMessage) => {}
      ).catch(err => {
        alert("Akses kamera ditolak/gagal: " + err);
        matikanKameraSaja();
      });

    } else {
      matikanKameraSaja();
    }
  }

  function matikanKameraSaja() {
    const readerElement = document.getElementById("reader");
    
    if (html5Qrcode && html5Qrcode.isScanning) {
      html5Qrcode.stop().then(() => {
        readerElement.style.display = "none";
        resetButtonScanState();
      }).catch(err => {
        console.error("Gagal menghentikan track kamera:", err);
      });
    } else {
      readerElement.style.display = "none";
      resetButtonScanState();
    }
  }

  function resetButtonScanState() {
    const btnResi = document.getElementById("btnScanResi");
    const btnItem = document.getElementById("btnScanItem");
    
    btnResi.innerText = "📷 Scan Resi";
    btnResi.style.backgroundColor = "#2e7d32";
    
    btnItem.innerText = "📷 Scan Item";
    btnItem.style.backgroundColor = "#2e7d32";
  }

  // Fungsi menambah item ke daftar sementara
  function tambahKeList() {
    const resi = document.getElementById("inputResi").value.trim();
    const item = document.getElementById("inputItem").value.trim();
    const qty = document.getElementById("inputQty").value;

    if (!resi) {
      alert("Nomor Resi wajib diisi / di-scan terlebih dahulu!");
      return;
    }
    if (!item) {
      alert("Nama/Barcode Item wajib diisi atau di-scan!");
      return;
    }

    // Masukkan ke array keranjang
    keranjangItem.push({ resi: resi, item: item, qty: qty });

    // Reset hanya input item dan qty (resi dibiarkan tetap agar bisa scan item berikutnya dengan resi yang sama)
    document.getElementById("inputItem").value = "";
    document.getElementById("inputQty").value = "1";
    document.getElementById("inputItem").focus();

    updateTabelPreview();
  }

  // Menghapus baris item dari daftar sementara
  function hapusItem(index) {
    keranjangItem.splice(index, 1);
    updateTabelPreview();
  }

  // Render tabel preview di layar
  function updateTabelPreview() {
    const tbody = document.getElementById("listPreview");
    tbody.innerHTML = "";

    if (keranjangItem.length === 0) {
      tbody.innerHTML = `<tr><td colspan="4" style="color: #888;">Belum ada item ditambahkan</td></tr>`;
      return;
    }

    keranjangItem.forEach((data, index) => {
      let row = `<tr>
        <td>${data.resi}</td>
        <td>${data.item}</td>
        <td>${data.qty}</td>
        <td><button type="button" onclick="hapusItem(${index})" style="background-color: #d32f2f; padding: 3px 6px; margin:0; width:auto;">X</button></td>
      </tr>`;
      tbody.innerHTML += row;
    });
  }

  // Kirim data secara asinkronus (di latar belakang tanpa jeda layar)
  const scriptURL = 'https://script.google.com/macros/s/AKfycbxzza9_rqvDszQvjnNdGeB9l7ML490Epc1rh-ykQN3DpeEhNIFTkVmJ75oocOhG3R-r/exec';

  function Kirim() {
    if (keranjangItem.length === 0) {
      alert("Daftar masih kosong, belum ada data yang bisa dikirim.");
      return;
    }

    matikanKameraSaja();
    const sekarang = new Date();
    const opsiWaktu = { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
    const waktuFormatted = sekarang.toLocaleString('id-ID', opsiWaktu);

    // Salin data keranjang saat ini dan langsung kosongkan tampilan layar agar bisa langsung input resi baru
    const dataKirim = [...keranjangItem];
    
    keranjangItem = [];
    document.getElementById("inputResi").value = "";
    document.getElementById("inputItem").value = "";
    document.getElementById("inputQty").value = "1";
    updateTabelPreview();

    // Berikan respons instan tanpa menunggu fetch selesai
    alert("Data berhasil dikirim!");

    // Proses fetch berjalan di background untuk setiap item
    dataKirim.forEach((data) => {
      const formData = new FormData();
      formData.append('tanggal_masuk', waktuFormatted);
      formData.append('user', currentUser);
      formData.append('resi', data.resi);
      formData.append('item', data.item);
      formData.append('Qty', data.qty);

      fetch(scriptURL, { method: 'POST', body: formData })
        .then(res => console.log("Background sync OK"))
        .catch(err => console.error("Gagal sinkronisasi background:", err));
    });
  }
</script>

</body>
</html>
